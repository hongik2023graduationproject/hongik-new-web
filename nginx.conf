# hongik.tolelom.xyz 정적 사이트(Astro dist) 서빙: / 소개, /playground/, /docs/.
# 포트 3000은 기존 배포(server-config의 hongik-web 스택, Traefik)와 같게 둬서 서버 쪽 설정을 바꾸지 않는다.
# WASM은 SharedArrayBuffer를 쓰지 않으므로 COOP/COEP 헤더는 붙이지 않는다.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik 뒤라 nginx가 아는 호스트·포트(…:3000)를 리다이렉트에 넣지 않는다. /docs → /docs/ 는 상대 경로로.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Astro 빌드 산출물(파일명에 해시)은 오래 캐시한다.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 파일명에 해시가 없는 WASM 런타임(워커, 글루코드, 바이너리, manifest)은 매번 재검증한다.
    # 휴리스틱 캐시가 남으면 새 WASM 과 옛 워커가 짝지어질 수 있다. .wasm 은 instantiateStreaming 이
    # 요구하는 MIME 을 명시한다(이 location 안의 types 는 여기에만 적용된다).
    location ~ ^/(hongik-worker\.js|hongik-wasm\.js|hongik-wasm\.wasm|manifest\.json)$ {
        types {
            application/javascript js;
            application/wasm wasm;
            application/json json;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 페이지는 디렉터리/index.html (trailingSlash: always). /docs → /docs/ 는 nginx가 301로 붙인다.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
