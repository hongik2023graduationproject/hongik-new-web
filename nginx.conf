# 플레이그라운드 정적 파일(next export) 서빙. 포트 3000은 기존 Next 서버와 같게 둬서
# 배포 쪽(compose healthcheck, 리버스 프록시) 설정을 바꾸지 않는다.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # WASM의 SharedArrayBuffer에 필요(이전에는 next.config.js headers()가 붙였다)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # 파일명에 해시가 들어가는 빌드 산출물은 오래 캐시한다
    location /_next/static/ {
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Monaco 워커는 파일명에 해시가 없어(next.config.js 참고) 위의 immutable 대신 매번 재검증한다.
    # 더 긴 접두라 /_next/static/ 보다 먼저 고른다. location 에 add_header 가 있으면 server 의 것을
    # 물려받지 않으므로 COEP·COOP 를 다시 붙인다.
    location /_next/static/monaco/ {
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
