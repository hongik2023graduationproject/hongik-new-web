name: Web CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 의존성 설치
        # --frozen-lockfile (기본값) — pnpm-lock.yaml과 package.json 불일치 시 CI 실패.
        # 누구나 로컬에서 의존 추가하면 lockfile도 같이 커밋해야 한다.
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 테스트 실행 (커버리지 포함)
        # 패키지마다 <패키지>/coverage/coverage-summary.json 을 남긴다(아래 요약 단계가 읽음).
        run: pnpm turbo run test -- --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary

      - name: 커버리지 요약 생성
        if: always()
        run: |
          echo '## Web 테스트 커버리지 리포트' > coverage-summary.md
          echo '' >> coverage-summary.md
          node -e "
            const fs = require('fs');
            const dirs = ['apps', 'packages'].flatMap(d => fs.readdirSync(d).map(n => d + '/' + n));
            const rows = dirs
              .filter(d => fs.existsSync(d + '/coverage/coverage-summary.json'))
              .map(d => {
                const t = require('./' + d + '/coverage/coverage-summary.json').total;
                return '| ' + d + ' | ' + [t.statements, t.branches, t.functions, t.lines].map(m => m.pct + '%').join(' | ') + ' |';
              });
            if (!rows.length) { console.log('커버리지 데이터를 찾을 수 없습니다.'); process.exit(0); }
            console.log('| 패키지 | Statements | Branches | Functions | Lines |');
            console.log('|--------|-----------|----------|-----------|-------|');
            rows.forEach(r => console.log(r));
          " >> coverage-summary.md

      - name: PR에 커버리지 코멘트
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: web-coverage
          path: coverage-summary.md

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/

  build-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 의존성 설치
        # --frozen-lockfile (기본값) — pnpm-lock.yaml과 package.json 불일치 시 CI 실패.
        # 누구나 로컬에서 의존 추가하면 lockfile도 같이 커밋해야 한다.
        run: pnpm install --frozen-lockfile

      # 플레이그라운드가 브라우저에서 hongik-wasm을 실행하므로,
      # apps/site/public/에 hong-ik release(`wasm-latest`)의 최신 산출물을 받아온다.
      # 첫 빌드 전 hong-ik의 WASM Publish 워크플로가 1회 이상 실행되어야 한다.
      - name: WASM 산출물 동기화
        run: |
          chmod +x scripts/sync-wasm.sh
          ./scripts/sync-wasm.sh

      - name: 사이트 빌드 (Astro)
        run: pnpm build

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hongik-web:latest
            ghcr.io/${{ github.repository_owner }}/hongik-web:main
            ghcr.io/${{ github.repository_owner }}/hongik-web:${{ github.sha }}
          platforms: linux/arm64
